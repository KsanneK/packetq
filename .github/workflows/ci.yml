name: CI

on:
  push:
    branches: [ "main", "dev" ]
  pull_request:
    branches: [ "main", "dev" ]

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.27'
          check-latest: true

      - name: Verify dependencies
        run: go mod verify

      - name: Check code formatting (gofmt)
        run: |
          diff -u <(echo -n) <(gofmt -d .)

      - name: Run go vet
        run: go vet ./...

      - name: Build server binary
        run: go build -v ./cmd/...

      - name: Run tests with race detector
        run: go test -v -race ./...

  lint:
    name: Golangci-lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.27'

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: latest
