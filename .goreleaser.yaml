version: 2
builds:
  - id: packetq-server
    binary: packetq-server
    main: ./cmd/server
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      - -X github.com/KsanneK/packetq/internal/version.Version={{.Version}}
      - -X github.com/KsanneK/packetq/internal/version.Commit={{.Commit}}
      - -X github.com/KsanneK/packetq/internal/version.Date={{.Date}}
  - id: packetq-cli
    binary: packetq
    main: ./cmd/cli
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      - -X github.com/KsanneK/packetq/internal/version.Version={{.Version}}
      - -X github.com/KsanneK/packetq/internal/version.Commit={{.Commit}}
      - -X github.com/KsanneK/packetq/internal/version.Date={{.Date}}
archives:
  - name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        format: zip
checksum:
  name_template: "checksums.txt"
changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"